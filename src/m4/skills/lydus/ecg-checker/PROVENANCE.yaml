changelog:
  - version: "1.0"
    date: 2026-07-13
    summary: >
      Initial skill creation from LYDUS-ECG-Checker v1.0.3. Slimmed to a headless, importable
      ecg_checker.py (the original PyQt5 GUI is not vendored — available in the source repo) that
      preserves the class1/2/3 attribute lists and the 0-100 curation-score formula, adds
      defensive Waveform parsing, a text report formatter, and an optional 12-lead PNG
      renderer. No SQL (operates on raw GE MUSE TSV, not QUIQ). Documented scale (0-100 vs
      1e6) and threshold (85 vs 90) discrepancies from the source docs.
