reviews:
  - by: TBD
    date: TBD
    scope: technical-accuracy
    notes: >
      Verify the headless ecg_checker.py reproduces the original GUI score exactly on real
      GE MUSE TSV exports (class1/2/3 attribute lists and present/(present+missing)*100 formula).
      Confirm Waveform parsing (literal_eval(Waveform)[1], LeadData[0]) matches GE MUSE export
      structure across MUSE versions. Reconcile the 0-100 vs 1,000,000-point scale and the
      85 vs 90 threshold discrepancies in the source documentation.

references:
  - LYDUS-ECG-Checker repository. https://github.com/Impku/LYDUS-ECG-Checker
