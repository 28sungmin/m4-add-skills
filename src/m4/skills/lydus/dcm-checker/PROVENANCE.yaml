changelog:
  - version: "1.0"
    date: 2026-07-13
    summary: >
      Initial skill creation from LYDUS-DCM-Checker v1.0.6. Slimmed to a headless, importable
      dcm_checker.py (pydicom; the original PyQt5 GUI is not vendored — available in the source repo)
      preserving the 21-tag set and int(present/21*100) score with a text report formatter.
      Faithful to the original: presence/missingness check only — the abstract's auto-fill
      feature is documented but NOT implemented, matching the original code. pydicom is used
      in place of the original SimpleITK for portability (identical tag set and score). No SQL
      (operates on raw DICOM, not QUIQ). Documented the presence-only vs range/type and
      0-100 vs 1e6 scale discrepancies.
